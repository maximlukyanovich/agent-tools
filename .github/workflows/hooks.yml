# The plugins' hooks are code that runs on every Write/Edit or Bash call in the projects that enable
# them, srv carries every command an agent sends to a server, the template setup copies runs in
# every project it sets up, change_size.py decides whether a review leaves the session and review_target.py what a pass reads; their tests run here on every push and pull request, since no project's
# CI covers them until the copy is made.
name: Plugin tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: mluk-fe hooks
        run: node --test 'plugins/mluk-fe/hooks/*.test.mjs'
      - name: mluk-ops guard
        run: python3 plugins/mluk-ops/hooks/test_guard.py
      - name: mluk-ops srv
        run: python3 plugins/mluk-ops/lib/test_srv.py
      - name: mluk-bootstrap start template
        run: node --test 'plugins/mluk-bootstrap/templates/start/lib/*.test.mjs'
      - name: mluk-repo change_size
        run: python3 plugins/mluk-repo/scripts/test_change_size.py
      - name: mluk-repo gate_record
        run: python3 plugins/mluk-repo/scripts/test_gate_record.py
      - name: mluk-repo ci wait
        run: python3 plugins/mluk-repo/scripts/test_ci_wait.py
      - name: mluk-repo review_target
        run: python3 plugins/mluk-repo/scripts/test_review_target.py
